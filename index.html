<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UnitSmith">
<meta name="theme-color" content="#0d0b0a">
<title>UnitSmith</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0d0b0a; --panel:#1a1614; --panel2:#231d1a; --line:#3a302b;
  --ember:#ff7a1a; --gold:#ffb347; --hot:#ffdd8a; --steel:#c3c9d0; --dim:#8c837d;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#f3ece6;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1408 0%,var(--bg) 60%) fixed}
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 30px)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:active{transform:scale(.96)}

header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:44px;height:44px;border-radius:12px;background:url(icons/icon-192.png) center/cover;box-shadow:0 0 18px #ff7a1a55}
.ttl{flex:1}
.ttl h1{margin:0;font-size:24px;letter-spacing:.5px;background:linear-gradient(90deg,var(--hot),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl small{color:var(--dim);font-size:12px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px}
.mode{padding:0 12px;width:auto;font-size:13px;font-weight:700}
.mode.on{background:linear-gradient(135deg,#5a2a0a,#2c160a);border-color:var(--ember);color:var(--hot)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.sel{background:linear-gradient(135deg,var(--ember),#c2410c);border-color:var(--gold);color:#1a0d05;font-weight:700;box-shadow:0 0 14px #ff7a1a66}

.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 30px #0008, inset 0 1px 0 #ffffff0d}
.lbl{font-size:11px;letter-spacing:1.5px;color:var(--dim);font-weight:700;margin-bottom:6px}
.unitbtn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:12px;background:#0f0c0b;border:1px solid var(--line);text-align:left;font-size:16px}
.unitbtn .em{font-size:20px;min-width:26px;text-align:center}
.unitbtn .nm{flex:1;font-weight:600}
.unitbtn .ch{color:var(--dim)}
.inrow{display:flex;gap:8px;margin-top:10px;align-items:center}
#val{flex:1;min-width:0;font-size:34px;font-weight:700;background:transparent;border:none;color:#fff;outline:none;padding:4px 2px;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
.small{width:46px;height:46px;border-radius:12px;background:#0f0c0b;border:1px solid var(--line);font-size:18px;font-weight:700}
.swapwrap{display:flex;justify-content:center;margin:-8px 0;position:relative;z-index:2}
#swap{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8ecef,#7d858c 60%,#3b4045);border:2px solid #1a1614;font-size:24px;box-shadow:0 4px 14px #000a}
#swap.spin{animation:spin .45s ease}
@keyframes spin{to{transform:rotate(360deg)}}
#out{font-size:34px;font-weight:800;margin-top:10px;word-break:break-all;color:var(--hot);text-shadow:0 0 18px #ff7a1a55;font-variant-numeric:tabular-nums;min-height:44px}
#out.glow{animation:glow .8s ease}
@keyframes glow{0%{color:#fff;text-shadow:0 0 30px #ffd28a}100%{color:var(--hot)}}
.approx{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#3b220f;color:var(--gold);margin-left:6px;vertical-align:middle;font-weight:700}
#note{font-size:13px;color:var(--steel);margin-top:8px;line-height:1.35}
#quip{font-size:13px;color:var(--gold);margin-top:6px;line-height:1.35;font-style:italic;min-height:18px}

#forge{width:100%;margin:14px 0 6px;padding:16px;border-radius:16px;font-size:18px;font-weight:800;letter-spacing:1px;color:#1a0d05;
  background:linear-gradient(180deg,#ffb347,#ff7a1a 55%,#c2410c);box-shadow:0 6px 24px #ff7a1a55, inset 0 2px 0 #fff6}
h2{font-size:13px;letter-spacing:1.5px;color:var(--dim);margin:20px 4px 8px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #2a2320;font-size:14px}
.row:last-child{border-bottom:none}
.row .em{width:28px;text-align:center;font-size:17px}
.row .nm{flex:1;color:var(--steel)}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;max-width:55%;word-break:break-all}
.row.cur{background:#2c1a0e}
.empty{padding:14px;color:var(--dim);font-size:13px;text-align:center}

/* picker sheet */
#sheet{position:fixed;inset:0;background:#000a;display:none;z-index:50}
#sheet.open{display:block}
.sheetbox{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:78%;background:var(--panel2);border-radius:22px 22px 0 0;border-top:1px solid var(--ember);display:flex;flex-direction:column;padding:10px 12px calc(var(--safe-b) + 6px);animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:#555;margin:2px auto 10px}
#search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f0c0b;color:#fff;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
#plist{flex:1;overflow-y:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.grp{font-size:11px;letter-spacing:1.5px;color:var(--ember);font-weight:800;padding:12px 6px 4px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;padding:12px 8px;border-bottom:1px solid #2a2320;text-align:left;font-size:15px}
.pitem .em{width:30px;text-align:center;font-size:18px;color:var(--steel)}
.pitem .nm{flex:1}
.pitem.sel{color:var(--hot)}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
#flash{position:fixed;inset:0;pointer-events:none;z-index:39;background:radial-gradient(circle at 50% 45%,#ffb34788,#ff7a1a22 50%,transparent 75%);opacity:0}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.shake{animation:shake .35s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-2px)}}
.rain{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:45;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%) translateY(40px);opacity:0;background:#2a1a10;border:1px solid var(--ember);color:var(--hot);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;transition:.3s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* no sideways business */
#rotate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
#rotate .big{font-size:64px;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-90deg)}}
@media (orientation:landscape) and (max-height:520px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"></div>
    <div class="ttl"><h1>UnitSmith</h1><small id="tag">Precision conversions, hand-forged.</small></div>
    <button class="iconbtn mode on" id="mode">🍌 Silly</button>
    <button class="iconbtn" id="snd">🔊</button>
  </header>

  <div class="chips" id="chips"></div>

  <div id="forgecard">
    <div class="card">
      <div class="lbl">FROM</div>
      <button class="unitbtn" id="fromBtn"></button>
      <div class="inrow">
        <input id="val" type="text" inputmode="decimal" autocomplete="off" value="1">
        <button class="small" id="neg">±</button>
        <button class="small" id="clr">⌫</button>
      </div>
    </div>
    <div class="swapwrap"><button id="swap" aria-label="Swap">⚒️</button></div>
    <div class="card">
      <div class="lbl">TO</div>
      <button class="unitbtn" id="toBtn"></button>
      <div id="out" title="Tap to copy">—</div>
      <div id="note"></div>
      <div id="quip"></div>
    </div>
  </div>

  <button id="forge">⚒ FORGE IT</button>

  <h2>EVERYTHING AT ONCE</h2>
  <div class="list" id="all"></div>

  <h2 style="display:flex;justify-content:space-between">RECENT FORGINGS <span id="clrHist" style="color:var(--ember);font-weight:700">CLEAR</span></h2>
  <div class="list" id="hist"></div>
  <p style="text-align:center;color:var(--dim);font-size:11px;margin-top:22px">Units marked ≈ are honest approximations.<br>No bananas were harmed in the making of this app.</p>
</div>

<div id="sheet"><div class="sheetbox">
  <div class="grab"></div>
  <input id="search" type="search" placeholder="Search units… (try “giraffe”)" autocomplete="off">
  <div id="plist"></div>
</div></div>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="toast"></div>
<div id="rotate"><div class="big">📱</div><h2 style="color:var(--hot);font-size:20px;margin:0">UnitSmith works upright only.</h2><div style="color:var(--steel)">The anvil is not rated for sideways use. Please un-tilt.</div></div>

<script src="units.js"></script>
<script src="app.js"></script>
</body>
</html>
